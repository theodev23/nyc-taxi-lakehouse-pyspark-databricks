[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-lakehouse-pyspark-databricks"
version = "0.1.0"
description = "A reproducible NYC Taxi lakehouse pipeline built with PySpark, Delta Lake, and Databricks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "delta-spark==3.3.2",
    "pyspark==3.5.9",
]

[project.scripts]
taxi-lakehouse-download = "taxi_lakehouse.cli:main"
taxi-lakehouse-generate-sample = "taxi_lakehouse.sample_cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["taxi_lakehouse"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
